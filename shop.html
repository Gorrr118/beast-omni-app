<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Coins</title>
    <link rel="stylesheet" href="shop.css"> 
</head>
<body>

    <div class="shop-header">
        <div class="shop-balance">Баланс: <span id="user-coins">0</span> coins</div>
        
        <select id="lang-dropdown">
            <option value="en">🇺🇸 US</option>
            <option value="ru">🇷🇺 RU</option>
        </select>
    </div>

    <div class="shop-content">
        
        <div class="category-section">
            <div class="category-title">
                <span class="category-line"></span>
                <span class="category-icon">🪙</span> Магазин Коинов
            </div>
            
            <div class="shop-grid">
    <!-- Пак 1 -->
    <div class="shop-card">
        <span class="badge badge-popular" style="background: #00e5ff; color: #000;">START</span>
        <div class="card-image">🪙</div>
        <div class="card-name">100 Coins</div>
        <button class="buy-btn">$0.99</button>
    </div>

    <!-- Пак 2 -->
    <div class="shop-card">
        <span class="badge badge-epic">MINI</span>
        <div class="card-image">🪙</div>
        <div class="card-name">250 Coins</div>
        <button class="buy-btn">$1.99</button>
    </div>

    <!-- Пак 3 -->
    <div class="shop-card">
        <span class="badge badge-popular">POPULAR</span>
        <div class="card-image">🪙</div>
        <div class="card-name">500 Coins</div>
        <button class="buy-btn">$2.99</button>
    </div>

    <!-- Пак 4 -->
    <div class="shop-card">
        <span class="badge badge-legendary">MEGA</span>
        <div class="card-image">🪙</div>
        <div class="card-name">1,000 Coins</div>
        <button class="buy-btn">$4.99</button>
    </div>
</div>

    <nav class="bottom-navbar">
        <a href="index.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Home</span>
            </div>
        </a>
        
        <a href="referals.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item">
                <span class="nav-icon">👥</span>
                <span class="nav-text">Referral</span>
            </div>
        </a>
        
        <div class="nav-item nav-center-item">
            <div class="nav-center-btn">
                <span class="center-icon">⚡</span>
            </div>
            <span class="nav-text center-text">Studio</span>
        </div>
        
        <a href="widgets.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">Widgets</span>
            </div>
        </a>
        
        <a href="shop.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item active">
                <span class="nav-icon">🛍️</span>
                <span class="nav-text">Shop</span>
            </div>
        </a>
    </nav>
    <!-- МОДАЛЬНОЕ ОКНО ПРЕДПРОСЛУШИВАНИЯ ГОЛОСА -->
<div id="voiceModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close">&times;</button>
        
        <div class="modal-header">
            <h3 id="modalVoiceName">Голос: Альфа-Боец</h3>
            <span class="modal-badge">PREVIEW</span>
        </div>

        <div class="modal-body">
            <!-- Стилизованный плеер -->
            <div class="audio-preview-box">
                <button id="playBtn" class="play-audio-btn">▶ Слушать демо</button>
                <!-- Скрытый тег аудио, куда JS будет подставлять нужный трек -->
                <audio id="previewAudio" src=""></audio>
            </div>
            <p class="modal-desc">Этот голос идеально подойдет для хайповых игровых видео и шортсов.</p>
        </div>

        <div class="modal-footer">
            <button id="modalBuyBtn" class="buy-btn">Купить за ⭐️ <span id="modalPrice">50</span></button>
        </div>
    </div>
</div>
    <script src="shop.js"></script>
</body>
</html>
