<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Generator | Gamer Hub</title>
    <link rel="stylesheet" href="shop.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Единая шапка -->
    <header class="global-header">
        <div class="user-box">
            <span class="user-icon">⚡</span>
            <span class="username" id="user-greeting">Hello, filatow</span>
        </div>
        <select id="lang-dropdown">
            <option value="en" selected>🇺🇸 US</option>
            <option value="ru">🇷🇺 RU</option>
        </select>
    </header>

    <!-- Основной контент (Генератор тегов) -->
    <div class="main-container">
        <div class="card">
            <div class="card-title">🚀 AI Tag Generator</div>
            <div class="card-subtitle">Опиши суть или сюжет стрима/ролика, и система создаст идеальные теги.</div>
            
            <div class="input-group">
                <textarea id="plot-input" placeholder="Например: стримлю как мы с котиками играем в шутер и постоянно проигрываем из-за мемов..."></textarea>
                <button class="generate-btn" id="generate-btn">Сгенерировать теги ⚡</button>
            </div>
        </div>

        <div class="card results-box">
            <div class="card-title">📌 Результат</div>
            <div class="tags-output" id="tags-output">#гейминг #стрим #котики #мемы #игры #funny</div>
            <button class="copy-btn" id="copy-btn">Копировать теги в буфер</button>
        </div>
    </div>

    <!-- Нижний навбар -->
    <nav class="bottom-navbar">
        <a href="index.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Home</span>
            </div>
        </a>
        
        <a href="referals.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item">
                <span class="nav-icon">👥</span>
                <span class="nav-text">Referral</span>
            </div>
        </a>
        
        <a href="studio.html" class="nav-center-item-link" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-center-item">
                <div class="nav-center-btn">
                    <span class="center-icon">⚡</span>
                </div>
                <span class="nav-text center-text">Studio</span>
            </div>
        </a>
        
        <a href="obs.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">obs Settings</span>
            </div>
        </a>
        
        <a href="shop.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item active">
                <span class="nav-icon">🏷️</span>
                <span class="nav-text">Tegs</span>
            </div>
        </a>
    </nav>

    <script src="shop.js"></script>
</body>
</html>
