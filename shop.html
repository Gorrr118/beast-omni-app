<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Coins</title>
    <link rel="stylesheet" href="shop.css"> 
</head>
<body>

    <div class="shop-header">
        <div class="shop-balance">Баланс: <span id="user-coins">0</span> coins</div>
        
        <select id="lang-dropdown">
            <option value="en">🇺🇸 US</option>
            <option value="ru">🇷🇺 RU</option>
        </select>
    </div>

    <div class="shop-content">
        
        <div class="category-section">
            <div class="category-title">
                <span class="category-line"></span>
                <span class="category-icon">🪙</span> Магазин Коинов
            </div>
            
            <div class="shop-grid">
                <div class="shop-card">
                    <span class="badge badge-popular">START</span>
                    <div class="card-image">💰</div>
                    <div class="card-name">100 Coins</div>
                    <button class="buy-btn">$2.99</button>
                </div>

                <div class="shop-card">
                    <span class="badge badge-popular">POPULAR</span>
                    <div class="card-image">💰</div>
                    <div class="card-name">500 Coins</div>
                    <button class="buy-btn">$9.99</button>
                </div>

                <div class="shop-card">
                    <span class="badge badge-epic">MEDIUM</span>
                    <div class="card-image">💎</div>
                    <div class="card-name">1,000 Coins</div>
                    <button class="buy-btn">$14.99</button>
                </div>

                <div class="shop-card">
                    <span class="badge badge-best">BEST VALUE</span>
                    <div class="card-image">💎</div>
                    <div class="card-name">2,000 Coins</div>
                    <button class="buy-btn">$24.99</button>
                </div>

                <div class="shop-card" style="grid-column: span 2;">
                    <span class="badge badge-legendary">MEGA BONUS</span>
                    <div class="card-image">👑</div>
                    <div class="card-name">3,000 Coins</div>
                    <button class="buy-btn">$29.99</button>
                </div>
            </div>
        </div>

    </div>

    <nav class="bottom-navbar">
        <a href="index.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Home</span>
            </div>
        </a>
        
        <a href="referals.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item">
                <span class="nav-icon">👥</span>
                <span class="nav-text">Referral</span>
            </div>
        </a>
        
        <div class="nav-item nav-center-item">
            <div class="nav-center-btn">
                <span class="center-icon">⚡</span>
            </div>
            <span class="nav-text center-text">Studio</span>
        </div>
        
        <a href="widgets.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">Widgets</span>
            </div>
        </a>
        
        <a href="shop.html" style="text-decoration: none; display: block; flex: 1;">
            <div class="nav-item active">
                <span class="nav-icon">🛍️</span>
                <span class="nav-text">Shop</span>
            </div>
        </a>
    </nav>
    <script src="shop.js"></script>
</body>
</html>
