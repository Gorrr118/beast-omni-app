<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Studio PRO</title>
    <link rel="stylesheet" href="studio.css">
</head>
<body>

    <div class="studio-container">
        <header class="studio-header">
            <div class="logo">🎬 <span>Creator Studio PRO</span></div>
            <div class="status">Режим: Готов к работе</div>
        </header>

        <div class="main-workspace">
            
            <aside class="left-panel">
                <h3>⚙️ Настройки видео</h3>
                
                <div class="control-group">
                    <label for="video-format">Формат видео</label>
                    <select id="video-format">
                        <option value="16:9">YouTube Video (16:9)</option>
                        <option value="9:16">TikTok / Shorts (9:16)</option>
                        <option value="1:1">Square (1:1)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="subtitles-text">Текст субтитров</label>
                    <textarea id="subtitles-text" placeholder="Введите текст для наложения..."></textarea>
                </div>

                <div class="control-group">
                    <label for="font-style">Стиль шрифта</label>
                    <select id="font-style">
                        <option value="Montserrat">Montserrat Bold</option>
                        <option value="Impact">Impact</option>
                        <option value="Arial">Arial Black</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="music-volume">Громкость музыки</label>
                    <input type="range" id="music-volume" min="0" max="100" value="50">
                </div>

                <button id="render-btn">⚡ СОЗДАТЬ ВИДЕО</button>
            </aside>

            <main class="center-area">
                
                <div class="preview-window">
                    <div class="player-screen" id="player">
                        <span class="preview-placeholder">PREVIEW PLAYER</span>
                    </div>
                </div>

                <div class="timeline-container">
                    <h4>🎞 Таймлайн</h4>
                    <div class="timeline-tracks">
                        <div class="track video-track">
                            <span class="track-label">Видеодорожка 01</span>
                        </div>
                        <div class="track audio-track">
                            <span class="track-label">Фоновое аудио</span>
                        </div>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <script src="studio.js"></script>
</body>
</html>
