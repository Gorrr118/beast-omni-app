<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAST OMNI | Referral</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="referral.css">
</head>
<body>

    <div class="top-bar">
        <div class="user-info">
            <span class="user-icon">👤</span>
            <span class="username">Hello, filatow</span>
        </div>
        <div class="lang-dropdown" id="lang-switch-btn">
            <span class="flag">🇺🇸</span>
            <span class="lang-text">US</span>
            <span class="arrow">▼</span>
        </div>
    </div>

    <div class="main-content">
        <div class="ref-header">
            <h1 data-lang="ref_title">Приглашай друзей — зарабатывай 15%!</h1>
            <p data-lang="ref_desc">Поделись своей уникальной ссылкой с другими стримерами. Получай проценты с каждой их первой покупки!</p>
        </div>

        <div class="bonus-cards">
            <div class="card">
                <div class="card-icon">💰</div>
                <div class="card-title" data-lang="your_bonus">Твой Бонус</div>
                <div class="card-value" data-lang="your_bonus_val">15% от оплаты</div>
            </div>
            <div class="card">
                <div class="card-icon">🎁</div>
                <div class="card-title" data-lang="friend_bonus">Бонус Другу</div>
                <div class="card-value" data-lang="friend_bonus_val">+5 дней Premium</div>
            </div>
        </div>

        <div class="link-section">
            <div class="input-group">
                <input type="text" id="ref-url" value="https://t.me/bot?start=loading" readonly>
                <button class="copy-btn" id="copy-button" data-lang="copy">Копировать</button>
            </div>
        </div>

        <div class="ref-stats">
            <div class="stat-item"><span data-lang="invited">Приглашено:</span> <span id="friends-count">0</span></div>
            <div class="stat-item"><span data-lang="earned">Заработано:</span> <span id="earned-count">0 ֏</span></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'">
            <img src="img/home.png" alt="Home" class="nav-icon">
            <span class="nav-text">Home</span>
        </div>
        <div class="nav-item active">
            <img src="img/referral.png" alt="Referral" class="nav-icon">
            <span class="nav-text">Referral</span>
        </div>
        <div class="nav-item studio-btn-wrapper">
            <div class="studio-btn">⚡</div>
            <span class="nav-text">Studio</span>
        </div>
        <div class="nav-item">
            <img src="img/widgets.png" alt="Widgets" class="nav-icon">
            <span class="nav-text">Widgets</span>
        </div>
        <div class="nav-item">
            <img src="img/shop.png" alt="Shop" class="nav-icon">
            <span class="nav-text">Shop</span>
        </div>
    </div>

    <script src="referral.js"></script>
</body>
</html>
